<div class="login-page-container">

    <div class="login-split">

        <!-- Columna izquierda: Imagen de marca e Ilustración -->
        <div class="login-left">
            <div class="illustration-wrapper">
                <div class="illustration-glow"></div>
                <!-- Enlace a la imagen personalizada del usuario en public/ -->
                <img src="/imagen.jpg" alt="Resume Maker Illustration" class="illustration-img">
            </div>
            <h1 class="left-title">TÚ PRÓXIMO GRAN<br>TRABAJO EMPIEZA AQUÍ.</h1>
            <p class="left-subtitle">Accede para gestionar tus hojas de vida.</p>
        </div>

        <!-- Columna derecha: Tarjeta de inicio de sesión -->
        <div class="login-right">
            <div class="login-card">
                
                <!-- Adornos de esquina (Superior-Derecha e Inferior-Izquierda) -->
                <svg class="card-ornament card-ornament-tr" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M90 10 C90 30, 70 40, 50 40 C30 40, 20 60, 20 80 M90 10 C70 10, 60 20, 60 40 C60 60, 40 70, 20 80 M90 10 C90 10, 85 25, 75 30 C65 35, 60 45, 55 55 M50 20 C45 30, 35 35, 25 35 M40 50 C30 50, 25 60, 25 70" stroke="#caa765" stroke-width="2.5" stroke-linecap="round"/>
                    <circle cx="90" cy="10" r="3.5" fill="#caa765"/>
                    <circle cx="20" cy="80" r="3.5" fill="#caa765"/>
                </svg>

                <svg class="card-ornament card-ornament-bl" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M90 10 C90 30, 70 40, 50 40 C30 40, 20 60, 20 80 M90 10 C70 10, 60 20, 60 40 C60 60, 40 70, 20 80 M90 10 C90 10, 85 25, 75 30 C65 35, 60 45, 55 55 M50 20 C45 30, 35 35, 25 35 M40 50 C30 50, 25 60, 25 70" stroke="#caa765" stroke-width="2.5" stroke-linecap="round"/>
                    <circle cx="90" cy="10" r="3.5" fill="#caa765"/>
                    <circle cx="20" cy="80" r="3.5" fill="#caa765"/>
                </svg>

                <h2 class="card-title">Iniciar sesión</h2>

                <form [formGroup]="formularioLogin" (ngSubmit)="iniciarSesion()">
                    
                    <!-- Campo de Email -->
                    <div class="form-group-custom">
                        <label class="label-custom">Email</label>
                        <div class="input-container-custom">
                            <span class="input-icon-left">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                                    <path d="M22 7l-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
                                </svg>
                            </span>
                            <input 
                                class="input-custom" 
                                type="email" 
                                formControlName="email" 
                                placeholder="Ingrese su email"
                                required>
                        </div>
                    </div>

                    <!-- Campo de Contraseña -->
                    <div class="form-group-custom">
                        <label class="label-custom">Contraseña</label>
                        <div class="input-container-custom">
                            <span class="input-icon-left">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                                </svg>
                            </span>
                            <input 
                                class="input-custom" 
                                [type]="mostrarContrasena ? 'text' : 'password'" 
                                formControlName="password"
                                placeholder="Ingrese su contraseña"
                                required>
                            
                            <!-- Icono interactivo para alternar la visibilidad de la contraseña -->
                            <button 
                                type="button" 
                                class="password-toggle" 
                                (click)="toggleMostrarContrasena()"
                                aria-label="Toggle password visibility">
                                <svg *ngIf="!mostrarContrasena" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                                <svg *ngIf="mostrarContrasena" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                    <line x1="1" y1="1" x2="23" y2="23"></line>
                                </svg>
                            </button>
                        </div>
                        <a href="#" class="forgot-password-link">¿Olvidaste tu contraseña?</a>
                    </div>

                    <!-- Botón de Envío -->
                    <button type="submit" class="btn-submit">Iniciar sesión</button>

                    <!-- Divisor -->
                    <div class="separator-container">
                        <span class="separator-line-ornament"></span>
                        <span class="separator-flourish">
                            <svg width="24" height="12" viewBox="0 0 24 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M2 6 C6 2, 10 2, 12 6 C14 10, 18 10, 22 6 M2 6 C5 6, 6 9, 8 9 C10 9, 11 6, 12 6 C13 6, 14 3, 16 3 C18 3, 19 6, 22 6" stroke="#caa765" stroke-width="1.5" stroke-linecap="round"/>
                            </svg>
                        </span>
                        <span class="separator-text">o continúa con</span>
                        <span class="separator-flourish">
                            <svg width="24" height="12" viewBox="0 0 24 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M2 6 C6 2, 10 2, 12 6 C14 10, 18 10, 22 6 M2 6 C5 6, 6 9, 8 9 C10 9, 11 6, 12 6 C13 6, 14 3, 16 3 C18 3, 19 6, 22 6" stroke="#caa765" stroke-width="1.5" stroke-linecap="round"/>
                            </svg>
                        </span>
                        <span class="separator-line-ornament"></span>
                    </div>

                    <!-- Botones de Redes Sociales -->
                    <div class="social-buttons-container">
                        <button type="button" class="btn-social btn-social-google">
                            <span class="social-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
                                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                                </svg>
                            </span>
                            Google
                        </button>
                        <button type="button" class="btn-social btn-social-linkedin">
                            <span class="social-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.779-1.75-1.75s.784-1.75 1.75-1.75 1.75.779 1.75 1.75-.784 1.75-1.75 1.75zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/>
                                </svg>
                            </span>
                            LinkedIn
                        </button>
                    </div>

                    <!-- Pie de página con enlace de registro -->
                    <div class="card-footer-custom">
                        ¿No tienes cuenta? <a href="#" class="register-link">Regístrate</a>
                    </div>

                </form>

            </div>
        </div>

    </div>

</div>
